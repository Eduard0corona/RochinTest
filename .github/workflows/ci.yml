name: ci

on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_traceability.py lee las etiquetas fase-N-ok
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del verificador
        run: python -m pip install "jsonschema>=4.18" sqlfluff
      - name: T28 · verificador del paquete
        run: python -B spec/tools/verify_package.py
      - name: Compuerta completa
        run: build/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
