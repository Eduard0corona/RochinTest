# Entorno local de desarrollo: SQL Server 2022 y RabbitMQ con healthchecks.
# Las contraseñas vienen de .env (copiar .env.example); nunca se guardan en el repositorio.
# Las pruebas no usan este archivo: Testcontainers levanta sus propios contenedores con las
# mismas imágenes.
#
#   docker compose up -d
#   dotnet run --project src/EdgeHost -- provision   # base y logins cp_migrator / cp_app
#   dotnet run --project src/EdgeHost -- migrate     # DDL y semilla de spec/database
name: cartonprinting

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cartonprinting}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
